<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Español — предлоги</title><style>
*{box-sizing:border-box}:root{--ink:#172033;--muted:#667085;--a:#ef5a3c;--line:#e4e7ec;--good:#eafff3;--bad:#fff0f0;--sun:#fff7d6}body{margin:0;font-family:system-ui,-apple-system,Arial,sans-serif;background:linear-gradient(155deg,#fff8f4,#fffdfb);color:var(--ink)}.app{max-width:840px;margin:auto;padding:14px 12px 34px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:22px;font-weight:900}.badge{background:#fff;border:1px solid #eceef4;border-radius:999px;padding:8px 12px;font-weight:800}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.tab{border:1px solid var(--line);background:#fff;border-radius:17px;min-height:50px;padding:8px;font-weight:900;font-size:15px}.tab.on{background:var(--a);color:#fff;border-color:var(--a)}.card{margin-top:14px;background:#fff;border:1px solid #eef0f4;border-radius:28px;padding:22px;text-align:center;box-shadow:0 8px 30px #24325a14}.kicker{font-size:14px;font-weight:900;color:var(--a)}h2{font-size:26px;margin:5px 0 7px}.hint{font-size:16px;line-height:1.45;color:var(--muted);max-width:620px;margin:8px auto 18px}.visual{width:min(330px,82vw);height:min(235px,60vw);margin:12px auto 16px;border-radius:34px;display:flex;align-items:center;justify-content:center;font-size:min(110px,30vw);background:linear-gradient(145deg,#fffaf0,#fff1ec);border:2px solid #f5ded6}.word{font-size:38px;font-weight:1000;letter-spacing:.3px;margin:5px 0}.ru{color:var(--muted);font-size:16px;margin:3px 0 12px}.example{font-size:19px;font-weight:800;margin:4px 0 13px}.exampleRu{font-size:14px;color:var(--muted);margin:-6px 0 13px}button{border:0;border-radius:17px;min-height:52px;padding:11px 20px;font-size:17px;font-weight:850;cursor:pointer}.primary{background:var(--a);color:#fff}.secondary{background:#eef0f6;color:var(--ink)}.listen{background:var(--sun);color:#5a4610;border:1px solid #efd778}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:15px}.progress{display:flex;gap:6px;justify-content:center;margin:18px 0 0}.dot{height:8px;flex:1;max-width:34px;background:#e4e7ec;border-radius:20px}.dot.on{background:var(--a)}.reward{margin-top:13px;background:#fff;border:1px solid #eef0f4;border-radius:20px;padding:13px 16px;display:flex;justify-content:space-between;align-items:center}.small{font-size:14px;color:var(--muted)}.stars{font-size:24px}.note{margin:14px auto 0;max-width:620px;padding:11px 13px;border:1px dashed #cfd4df;border-radius:15px;background:#fafbfe;color:#5b6576;font-size:14px;line-height:1.4;text-align:left}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;max-width:650px;margin:14px auto}.choice{background:#fff;border:2px solid var(--line);border-radius:22px;min-height:108px;font-size:19px;padding:12px}.choice .emoji{display:block;font-size:48px;margin-bottom:6px}.choice.good{background:var(--good);border-color:#69c895}.choice.bad{background:var(--bad);border-color:#e59a9a}.status{min-height:28px;font-weight:900;margin-top:8px}.score{font-size:14px;color:var(--muted)}.chips{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:13px}.chip{border:1px solid var(--line);background:#fafafe;padding:6px 9px;border-radius:999px;font-size:13px;font-weight:800;color:#5d6575}.finish{font-size:95px}.mini{font-size:15px;color:var(--muted);margin-top:8px}.voiceInfo{font-size:13px;color:var(--muted);margin-top:8px}@media(max-width:520px){.brand{font-size:19px}.tab{font-size:13px;padding:7px 4px}.card{padding:17px}h2{font-size:22px}.word{font-size:31px}.choice{min-height:100px;font-size:17px}.choice .emoji{font-size:42px}}
</style></head><body><main class="app"><div class="top"><div class="brand">Español · Предлоги</div><div id="badge" class="badge">📍 Урок 1</div></div><div id="tabs" class="tabs"></div><section class="card"><div id="kicker" class="kicker"></div><h2 id="title"></h2><div id="hint" class="hint"></div><div id="body"></div><div id="progress" class="progress"></div><div class="actions"><button id="back" class="secondary">← Назад</button><button id="next" class="primary">Дальше →</button></div></section><section class="reward"><div><b>Прогресс</b><div id="rewardText" class="small"></div></div><div id="stars" class="stars">☆ ☆ ☆</div></section></main><script>
const place1=[
 ['cerca de','🏠👦','рядом с','La escuela está cerca de casa.','Школа находится рядом с домом.'],
 ['al lado de','🏠👦','рядом с / около','Estoy al lado de la puerta.','Я рядом с дверью.'],
 ['lejos de','👦···🏠','далеко от','Vivimos lejos del centro.','Мы живём далеко от центра.'],
 ['a la izquierda de','⬅️🚪','слева от','El banco está a la izquierda de la farmacia.','Банк слева от аптеки.'],
 ['a la derecha de','🚪➡️','справа от','El café está a la derecha del hotel.','Кафе справа от отеля.'],
 ['delante de','👦🏠','перед','Estoy delante de la casa.','Я перед домом.'],
 ['detrás de','🏠👦','за / позади','El coche está detrás de la casa.','Машина за домом.'],
 ['entre','🏠👦🏠','между','Estoy entre dos casas.','Я между двумя домами.']
];
const place2=[
 ['frente a','🏠↔️🏠','напротив','El supermercado está frente al banco.','Супермаркет напротив банка.'],
 ['alrededor de','🔄🏠','вокруг','Caminamos alrededor del parque.','Мы идём вокруг парка.'],
 ['dentro de','📦👦','внутри','El regalo está dentro de la caja.','Подарок внутри коробки.'],
 ['fuera de','👦📦','снаружи / вне','Estoy fuera de casa.','Я снаружи дома.'],
 ['encima de','📘⬆️🪑','на / сверху','El libro está encima de la mesa.','Книга на столе.'],
 ['debajo de','🪑⬇️🐱','под','El gato está debajo de la mesa.','Кот под столом.'],
 ['en medio de','🚗👦🚗','посреди / в середине','Está en medio de la calle.','Он посреди улицы.'],
 ['al fondo de','🌳···👦','в глубине / в конце','El baño está al fondo del pasillo.','Туалет в конце коридора.']
];
const timeWords=[
 ['antes de','1️⃣➡️2️⃣','до / перед','Lávate las manos antes de comer.','Вымой руки перед едой.'],
 ['después de','2️⃣➡️3️⃣','после','Jugamos después de clase.','Мы играем после урока.'],
 ['durante','⏳','во время / в течение','No hables durante la película.','Не разговаривай во время фильма.']
];
const lessons={
 1:{icon:'📍',name:'Урок 1',reward:'8 основных предлогов места',words:place1},
 2:{icon:'🧭',name:'Урок 2',reward:'Ещё 8 предлогов места',words:place2},
 3:{icon:'⏰',name:'Урок 3',reward:'3 предлога времени',words:timeWords}
};
let lesson=1,step=0,voice=null,quizScore=0,quizTarget=null,locked=false;
const $=s=>document.querySelector(s),body=$('#body'),title=$('#title'),hint=$('#hint'),kicker=$('#kicker'),progress=$('#progress'),back=$('#back'),next=$('#next'),stars=$('#stars'),rewardText=$('#rewardText'),badge=$('#badge');
function pickVoice(){if(!('speechSynthesis'in window))return;const vs=speechSynthesis.getVoices(),f=/elvira|helena|lucia|paulina|female|mujer|google español/i;voice=vs.find(v=>/^es-ES/i.test(v.lang)&&f.test(v.name))||vs.find(v=>/^es/i.test(v.lang)&&f.test(v.name))||vs.find(v=>/^es-ES/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang))||null}
if('speechSynthesis'in window){pickVoice();speechSynthesis.addEventListener?.('voiceschanged',pickVoice)}
function speak(t,el,slow=false){if(!('speechSynthesis'in window)){if(el)el.textContent='На этом браузере озвучка недоступна.';return}speechSynthesis.cancel();pickVoice();const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=slow?.68:.82;u.pitch=1.02;if(voice)u.voice=voice;if(el){el.textContent=slow?'Слушай медленно и повторяй…':'Слушай и повторяй…';u.onend=()=>el.textContent='';u.onerror=()=>el.textContent='Не удалось запустить голос. Попробуй ещё раз.'}speechSynthesis.speak(u)}
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildScreens(){const words=lessons[lesson].words;return [
 {t:'intro',title:`${lessons[lesson].name} ${lessons[lesson].icon}`,hint:'Сначала слушаем и повторяем. Потом проверяем себя в игре.'},
 ...words.map((x,i)=>({t:'listen',title:`Фраза ${i+1} из ${words.length}`,data:x,hint:'Нажми «Слушать», повтори вслух 3 раза и посмотри пример.'})),
 {t:'quiz',title:'Проверка на слух 🎧',hint:'Нажми «Слушать» и выбери правильный перевод. Нужно 5 правильных ответов.'},
 {t:'finish',title:'Отлично! 🏆',hint:'Урок закончен. Повтори его завтра — так предлоги запомнятся быстрее.'}
]}
function tabs(){const box=$('#tabs');box.innerHTML='';Object.entries(lessons).forEach(([n,l])=>{const b=document.createElement('button');b.className='tab'+(+n===lesson?' on':'');b.textContent=`${l.name} ${l.icon}`;b.onclick=()=>{lesson=+n;step=0;quizScore=0;quizTarget=null;render()};box.appendChild(b)})}
function nav(screens){progress.innerHTML=screens.map((_,i)=>`<span class="dot ${i<=step?'on':''}"></span>`).join('');back.disabled=step===0;back.style.opacity=step===0?'.4':'1';next.textContent=step===screens.length-1?'Сначала ↻':'Дальше →';rewardText.textContent=lessons[lesson].reward;stars.textContent=step===screens.length-1?'★ ★ ★':step>Math.floor(screens.length/2)?'★ ★ ☆':'★ ☆ ☆'}
function listenCard(s){const x=s.data;body.innerHTML=`<div class="visual">${x[1]}</div><div class="word">${x[0]}</div><div class="ru">${x[2]}</div><div class="example">${x[3]}</div><div class="exampleRu">${x[4]}</div><div class="actions"><button id="listen" class="listen">🔊 Слушать</button><button id="slow" class="secondary">🐢 Медленно</button></div><div id="status" class="status"></div><div class="note">1) Послушай. 2) Повтори 3 раза. 3) Потом произнеси пример целиком.</div><div class="voiceInfo">Используется испанский голос браузера (es-ES).</div>`;$('#listen').onclick=()=>speak(x[0],$('#status'),false);$('#slow').onclick=()=>speak(x[0],$('#status'),true)}
function intro(){body.innerHTML=`<div class="visual">🇪🇸</div><div class="word">¡Vamos!</div><div class="ru">Начинаем</div><div class="note">В этом уроке не зубрим список. Работаем так: звук → повторение → пример → игра.</div>`}
function quiz(){const words=lessons[lesson].words;body.innerHTML=`<button id="ql" class="listen">🔊 Слушать фразу</button><div id="choices" class="choices"></div><div id="status" class="status"></div><div id="score" class="score">Правильных ответов: ${quizScore} из 5</div>`;function round(play=true){locked=false;if(quizScore>=5){quizTarget=null;$('#choices').innerHTML='';$('#status').textContent='🏆 Отлично! Задание выполнено.';return}quizTarget=words[Math.floor(Math.random()*words.length)];const opts=shuffle([quizTarget,...shuffle(words.filter(x=>x[0]!==quizTarget[0])).slice(0,3)]);$('#choices').innerHTML='';opts.forEach(x=>{const b=document.createElement('button');b.className='choice';b.innerHTML=`<span class="emoji">${x[1]}</span>${x[2]}`;b.onclick=()=>{if(locked)return;locked=true;if(x[0]===quizTarget[0]){b.classList.add('good');quizScore++;$('#score').textContent=`Правильных ответов: ${quizScore} из 5`;$('#status').textContent='⭐ Правильно!';setTimeout(()=>round(true),650)}else{b.classList.add('bad');$('#status').textContent='Ещё раз послушай 🙂';locked=false;speak(quizTarget[0])}};$('#choices').appendChild(b)});if(play)speak(quizTarget[0],$('#status'))}$('#ql').onclick=()=>quizTarget?speak(quizTarget[0],$('#status')):round(true);round(false)}
function finish(){body.innerHTML=`<div class="finish">🏆</div><div class="word">¡Muy bien!</div><div class="ru">Очень хорошо!</div><div class="chips"><span class="chip">👂 слушал</span><span class="chip">🗣️ повторял</span><span class="chip">🎯 проверил себя</span></div>`;speak('¡Muy bien!')}
function render(){tabs();const screens=buildScreens(),s=screens[step];badge.textContent=`${lessons[lesson].icon} ${lessons[lesson].name}`;kicker.textContent=s.t==='listen'?'СЛУШАЙ И ПОВТОРЯЙ':s.t==='quiz'?'ИГРА НА СЛУХ':s.t==='finish'?'ФИНИШ':'СТАРТ';title.textContent=s.title;hint.textContent=s.hint;if(s.t==='intro')intro();else if(s.t==='listen')listenCard(s);else if(s.t==='quiz')quiz();else finish();nav(screens)}
back.onclick=()=>{if(step>0){step--;render()}};next.onclick=()=>{const screens=buildScreens();if(step<screens.length-1){step++;render()}else{step=0;quizScore=0;quizTarget=null;render()}};render();
</script></body></html>
