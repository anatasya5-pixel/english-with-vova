<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English with Vova</title><style>
*{box-sizing:border-box}:root{--ink:#172033;--muted:#667085;--a:#7c5cff;--line:#e4e7ec;--good:#eafff3;--bad:#fff0f0;--sun:#fff7d6}body{margin:0;font-family:system-ui,-apple-system,Arial,sans-serif;background:linear-gradient(155deg,#f6f8ff,#fbf9ff);color:var(--ink)}.app{max-width:820px;margin:auto;padding:14px 12px 34px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:22px;font-weight:900}.badge{background:#fff;border:1px solid #eceef4;border-radius:999px;padding:8px 12px;font-weight:800}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.tab{border:1px solid var(--line);background:#fff;border-radius:17px;min-height:50px;padding:8px;font-weight:900;font-size:16px}.tab.on{background:var(--a);color:#fff;border-color:var(--a)}.card{margin-top:14px;background:#fff;border:1px solid #eef0f4;border-radius:28px;padding:22px;text-align:center;box-shadow:0 8px 30px #24325a14}.kicker{font-size:14px;font-weight:900;color:var(--a)}h2{font-size:26px;margin:5px 0 7px}.hint{font-size:16px;line-height:1.45;color:var(--muted);max-width:590px;margin:8px auto 18px}.visual{width:min(310px,78vw);height:min(260px,68vw);margin:12px auto 16px;border-radius:34px;display:flex;align-items:center;justify-content:center;font-size:min(142px,36vw);background:linear-gradient(145deg,#fffaf0,#f4efff);border:2px solid #eee7ff}.word{font-size:38px;font-weight:1000;letter-spacing:1px;margin:5px 0}.ru{color:var(--muted);font-size:15px;margin:2px 0 12px}button{border:0;border-radius:17px;min-height:52px;padding:11px 20px;font-size:17px;font-weight:850;cursor:pointer}.primary{background:var(--a);color:#fff}.secondary{background:#eef0f6;color:var(--ink)}.listen{background:var(--sun);color:#5a4610;border:1px solid #efd778}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:15px}.progress{display:flex;gap:6px;justify-content:center;margin:18px 0 0}.dot{height:8px;flex:1;max-width:38px;background:#e4e7ec;border-radius:20px}.dot.on{background:var(--a)}.reward{margin-top:13px;background:#fff;border:1px solid #eef0f4;border-radius:20px;padding:13px 16px;display:flex;justify-content:space-between;align-items:center}.small{font-size:14px;color:var(--muted)}.stars{font-size:24px}.note{margin:14px auto 0;max-width:590px;padding:11px 13px;border:1px dashed #cfd4df;border-radius:15px;background:#fafbfe;color:#5b6576;font-size:14px;line-height:1.4;text-align:left}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;max-width:620px;margin:14px auto}.choice{background:#fff;border:2px solid var(--line);border-radius:22px;min-height:145px;font-size:70px;padding:8px}.choice.good{background:var(--good);border-color:#69c895}.choice.bad{background:var(--bad);border-color:#e59a9a}.status{min-height:28px;font-weight:900}.score{font-size:14px;color:var(--muted)}.chips{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:13px}.chip{border:1px solid var(--line);background:#fafafe;padding:6px 9px;border-radius:999px;font-size:13px;font-weight:800;color:#5d6575}.finish{font-size:100px}.combo{grid-template-columns:repeat(2,1fr)}.combo .choice{font-size:58px}.read{grid-template-columns:repeat(2,1fr);max-width:520px}.read .choice{font-size:32px;min-height:120px}@media(max-width:520px){.brand{font-size:19px}.tab{font-size:14px;padding:7px 4px}.card{padding:17px}h2{font-size:22px}.word{font-size:33px}.choice{min-height:115px;font-size:55px}.combo .choice{font-size:45px}}
</style></head><body><main class="app"><div class="top"><div class="brand">English with Vova</div><div id="badge" class="badge">🏝️ Урок 1</div></div><div id="tabs" class="tabs"></div><section class="card"><div id="kicker" class="kicker"></div><h2 id="title"></h2><div id="hint" class="hint"></div><div id="body"></div><div id="progress" class="progress"></div><div class="actions"><button id="back" class="secondary">← Назад</button><button id="next" class="primary">Дальше →</button></div></section><section class="reward"><div><b id="rewardTitle">Награда</b><div id="rewardText" class="small"></div></div><div id="stars" class="stars">☆ ☆ ☆</div></section></main><script>
const oldWords=[['apple','🍎','яблоко'],['ball','⚽','мяч'],['car','🚗','машина'],['sun','☀️','солнце'],['book','📘','книга'],['fish','🐟','рыба'],['bird','🐦','птица'],['house','🏠','дом'],['milk','🥛','молоко'],['water','💧','вода']];
const newWords=[['red','🔴','красный'],['blue','🔵','синий'],['green','🟢','зелёный'],['yellow','🟡','жёлтый'],['black','⚫','чёрный'],['white','⚪','белый'],['big','🐘','большой'],['small','🐭','маленький'],['one','1️⃣','один'],['two','2️⃣','два']];
const L={
1:{icon:'🏝️',name:'Урок 1',reward:'Пройди четыре шага',screens:[
 {t:'plain',title:'Приветствие 👋',v:'👋',w:'Hello!',hint:'Смотри на картинку и слушай преподавателя. Читать пока не нужно.'},
 {t:'plain',title:'Слушаем вопрос 🙂',v:'👦',w:'',hint:'Сейчас преподаватель спросит имя. Просто послушай.'},
 {t:'plain',title:'Отвечаем',v:'👦💬',w:'My     name     is     Vova.',hint:'Повтори за преподавателем очень медленно.'},
 {t:'finish1',title:'Great!',hint:'Первый мини-урок закончен. Отличная работа!'}]},
2:{icon:'🎨',name:'Урок 2',reward:'Пройди урок и игру',screens:[
 {t:'listen',title:'Повторяем знакомое 👋',v:'👋',w:'Hello!',say:'Hello!',hint:'Слушай и повторяй. Читать не нужно.'},
 {t:'listen',title:'Повторяем фразу 🙂',v:'👦',w:'My name is Vova.',say:'My name is Vova.',hint:'Сначала слушаем, потом повторяем.'},
 ...oldWords.map((x,i)=>({t:'listen',title:`Новое слово ${i+1} из 10`,v:x[1],w:x[0],ru:x[2],say:x[0],hint:'Картинка → звук → повтори два раза.'})),
 {t:'quiz2',title:'Проверяем на слух 🎧',hint:'Слушай слово и выбери правильную картинку. Читать не нужно.'},
 {t:'finish2',title:'Урок 2 пройден!',hint:'10 новых слов и тренировка понимания на слух.'}]},
3:{icon:'🌈',name:'Урок 3',reward:'Цвета, размеры и первые сочетания',screens:[
 {t:'review3',title:'Быстрое повторение 🎧',hint:'Слушай слова прошлого урока и выбирай картинки. Нужно 4 правильных ответа.'},
 ...newWords.map((x,i)=>({t:'listen',title:`Новое слово ${i+1} из 10`,v:x[1],w:x[0],ru:x[2],say:x[0],hint:'Картинка → звук → повтори два раза.'})),
 {t:'combo3',title:'Говорим по два слова 🧩',hint:'Нажимай на картинки, слушай и повторяй целиком.'},
 {t:'read3',title:'Первый шаг к чтению 👀',hint:'Звучание уже знакомо. Теперь просто запоминаем вид двух слов — без чтения по буквам.'},
 {t:'finish3',title:'Урок 3 пройден!',hint:'Повторили старые слова, выучили 10 новых и начали соединять слова.'}]}
};
let lesson=1,step=0;const quiz={2:{n:0,target:null},3:{n:0,target:null}};let voice=null;
const $=s=>document.querySelector(s),body=$('#body'),title=$('#title'),hint=$('#hint'),kicker=$('#kicker'),progress=$('#progress'),back=$('#back'),next=$('#next'),stars=$('#stars'),rewardText=$('#rewardText'),badge=$('#badge');
function pickVoice(){if(!('speechSynthesis'in window))return;const vs=speechSynthesis.getVoices(),f=/samantha|zira|aria|jenny|ava|victoria|karen|moira|serena|susan|tessa|joanna|salli|emma|amy|olivia|sonia|female/i;voice=vs.find(v=>/^en-US/i.test(v.lang)&&f.test(v.name))||vs.find(v=>/^en-GB/i.test(v.lang)&&f.test(v.name))||vs.find(v=>/^en/i.test(v.lang)&&f.test(v.name))||vs.find(v=>/^en-US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}if('speechSynthesis'in window){pickVoice();speechSynthesis.addEventListener?.('voiceschanged',pickVoice)}
function speak(t,el){if(!('speechSynthesis'in window)){if(el)el.textContent='Озвучка браузером недоступна.';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.72;u.pitch=1.04;if(voice)u.voice=voice;if(el){el.textContent='Слушай и повторяй…';u.onend=()=>el.textContent=''}speechSynthesis.speak(u)}
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function tabs(){const box=$('#tabs');box.innerHTML='';Object.entries(L).forEach(([n,l])=>{const b=document.createElement('button');b.className='tab'+(+n===lesson?' on':'');b.textContent=`${l.name} ${l.icon}`;b.onclick=()=>{lesson=+n;step=0;render()};box.appendChild(b)})}
function nav(){const sc=L[lesson].screens;progress.innerHTML=sc.map((_,i)=>`<span class="dot ${i<=step?'on':''}"></span>`).join('');back.disabled=step===0;back.style.opacity=step===0?'.4':'1';next.textContent=step===sc.length-1?'Сначала ↻':'Дальше →';rewardText.textContent=L[lesson].reward;stars.textContent=(step===sc.length-1)?(lesson===1?'★ ☆ ☆':'★ ★ ★'):'☆ ☆ ☆'}
function visual(s,audio=true){body.innerHTML=`<div class="visual">${s.v||''}</div><div class="word">${s.w||''}</div>${s.ru?`<div class="ru">${s.ru}</div>`:''}${audio?'<button id="listen" class="listen">🔊 Слушать</button><div id="status" class="status"></div>':''}<div class="note">${s.t==='listen'?'Вова слушает и повторяет. Не требуем чтения.':'Работаем голосом вместе с преподавателем.'}</div>`;if(audio)$('#listen').onclick=()=>speak(s.say,$('#status'))}
function quizScreen(words,which,goal){const q=quiz[which];body.innerHTML=`<button id="ql" class="listen">🔊 Слушать слово</button><div id="choices" class="choices"></div><div id="status" class="status"></div><div id="score" class="score">Правильных ответов: ${q.n} из ${goal}</div>`;function round(play=true){if(q.n>=goal){q.target=null;$('#status').textContent='🏆 Отлично! Задание выполнено.';return}q.target=words[Math.floor(Math.random()*words.length)];const opts=shuffle([q.target,...shuffle(words.filter(x=>x[0]!==q.target[0])).slice(0,2)]);$('#choices').innerHTML='';opts.forEach(x=>{const b=document.createElement('button');b.className='choice';b.textContent=x[1];b.onclick=()=>{if(x[0]===q.target[0]){b.classList.add('good');q.n++;$('#score').textContent=`Правильных ответов: ${q.n} из ${goal}`;$('#status').textContent='⭐ Правильно!';q.target=null;setTimeout(()=>round(true),600)}else{b.classList.add('bad');$('#status').textContent='Ещё раз послушай 🙂';speak(q.target[0])}};$('#choices').appendChild(b)});if(play)speak(q.target[0],$('#status'))}$('#ql').onclick=()=>q.target?speak(q.target[0],$('#status')):round(true);round(false)}
function combo(){const a=[['🔴🚗','red car'],['🔵⚽','blue ball'],['🐘🏠','big house'],['🐭🐟','small fish']];body.innerHTML=`<div class="choices combo">${a.map(x=>`<button class="choice comboBtn" data-say="${x[1]}">${x[0]}</button>`).join('')}</div><div id="status" class="status"></div><div class="note">Цель — начать говорить короткими сочетаниями, используя слова из разных уроков.</div>`;document.querySelectorAll('.comboBtn').forEach(b=>b.onclick=()=>speak(b.dataset.say,$('#status')))}
function read(){body.innerHTML=`<div class="choices read"><button class="choice rbtn" data-say="red">🔴<br><b>red</b></button><button class="choice rbtn" data-say="blue">🔵<br><b>blue</b></button></div><div id="status" class="status"></div><div class="note">Сегодня достаточно узнавать глазами только два слова: <b>red</b> и <b>blue</b>.</div>`;document.querySelectorAll('.rbtn').forEach(b=>b.onclick=()=>speak(b.dataset.say,$('#status')))}
function finish(s){body.innerHTML=`<div class="finish">${lesson===3?'🌈🏆':'🏆⭐'}</div><div class="stars" style="font-size:40px">${lesson===1?'★ ☆ ☆':'★ ★ ★'}</div>${lesson>1?`<div class="chips">${(lesson===2?oldWords:newWords).map(x=>`<span class="chip">${x[1]} ${x[0]}</span>`).join('')}</div>`:''}<div class="note">${lesson===3?'После урока продолжим голосом: я называю цвет или сочетание, Вова повторяет, а я мягко корректирую произношение.':'Отличная работа!'}</div>`}
function render(){tabs();const s=L[lesson].screens[step];badge.textContent=`${L[lesson].icon} ${L[lesson].name}`;kicker.textContent=lesson===1?'Мини-урок':lesson===2?'10 новых слов • смотрим • слушаем • повторяем':'10 новых слов • цвета и размеры • слушаем и говорим';title.textContent=s.title;hint.textContent=s.hint||'';if(s.t==='plain')visual(s,false);else if(s.t==='listen')visual(s,true);else if(s.t==='quiz2')quizScreen(oldWords,2,5);else if(s.t==='review3')quizScreen(oldWords,3,4);else if(s.t==='combo3')combo();else if(s.t==='read3')read();else finish(s);nav()}
back.onclick=()=>{if(step>0){step--;render()}};next.onclick=()=>{const n=L[lesson].screens.length;if(step===n-1){step=0;if(quiz[lesson])quiz[lesson]={n:0,target:null}}else step++;render()};render();
</script></body></html>
